[package]
name = "nomad-table-spike"
version = "0.1.0"
edition = "2021"
description = "Test table contract: asks the OutLayer dealer for a hand, then verifies the randomness proof and re-deals on-chain"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
poker-core = { path = "../poker-core", features = ["serde"] }
serde_json = "1.0"
hex = "0.4"
uint = { version = "0.10", default-features = false }

[dev-dependencies]
poker-core = { path = "../poker-core", features = ["agent", "serde"] }
near-sdk = { version = "5", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
