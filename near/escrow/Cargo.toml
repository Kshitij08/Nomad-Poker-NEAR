[package]
name = "nomad-escrow"
version = "0.1.0"
edition = "2021"
description = "Holds players' stakes for human tables, hosted tables and tournaments; the table server reports results"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
hex = "0.4"
uint = { version = "0.10", default-features = false }

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# The mocked blockchain in unit tests is slow unoptimised.
[profile.dev.package."*"]
opt-level = 2
