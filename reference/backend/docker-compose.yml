services:
  postgres:
    image: postgres:16-alpine
    container_name: poker-escrow-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: poker_escrow
    volumes:
      - poker_escrow_pgdata:/var/lib/postgresql/data

volumes:
  poker_escrow_pgdata:
