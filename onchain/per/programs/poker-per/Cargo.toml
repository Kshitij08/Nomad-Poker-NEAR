[package]
name = "poker-per"
version = "0.1.0"
description = "Private poker tables on a MagicBlock Private Ephemeral Rollup"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "poker_per"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.2.1", features = ["init-if-needed"] }
anchor-spl = { version = "=1.2.1" }
ephemeral-rollups-sdk = { version = "=0.17.3", features = ["anchor", "access-control", "vrf"] }
solana-sha256-hasher = "3"
# Zero-copy accounts (the hand log); same version Anchor already pulls in.
bytemuck = { version = "=1.25.2", features = ["derive", "min_const_generics"] }

[dev-dependencies]
serde_json = "1"
