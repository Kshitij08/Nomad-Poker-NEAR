name: D1 backup

# Daily off-site dump of the production D1 database to its R2 bucket (infra/backup-d1.mjs):
# backups/d1/<date>/<bookmark>.sql.gz. Does nothing until a repository secret CLOUDFLARE_API_TOKEN exists (an account
# API token with D1: Edit and Workers R2 Storage: Edit). Scheduled runs only fire from the default branch (main).
# Runs at 04:30 UTC, a quiet hour: an export briefly blocks writes (table bookkeeping retries through it).
# Staging is not backed up: it holds test data only (`node infra/backup-d1.mjs staging` still works by hand).
on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a5e26389a89c0c84a7b4939e38574714
    steps:
      - name: Skip without a token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "No CLOUDFLARE_API_TOKEN secret; nothing to do."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - name: Back up production
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: PATH="$PWD/node_modules/.bin:$PATH" node infra/backup-d1.mjs production
