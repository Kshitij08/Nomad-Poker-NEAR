[package]
name = "poker-wasm"
version = "0.1.0"
edition = "2021"
description = "poker-core's session replay for JavaScript: the exact code the table contract runs, compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
poker-core = { path = "../poker-core", features = ["agent"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
