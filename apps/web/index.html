<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Portrait and landscape both supported (docs/portrait-design.md); full-screen when added to the home screen. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b1016" />
    <meta name="format-detection" content="telephone=no" />
    <title>Nomad Poker</title>
    <!-- App icon and link preview (public/assets/ui2/app/). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/ui2/app/app_icon_32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/ui2/app/app_icon_16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/ui2/app/app_icon_180.png" />
    <meta property="og:title" content="Nomad Poker" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/ui2/app/og_share_1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/assets/ui2/app/og_share_1200x630.png" />
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- Boot / loading cover (the branding poster) until the first screen is up; main.ts fades it out. Phones in
         portrait keep the whole logo: the poster is scaled to the logo's width over the same art without the logo. -->
    <link rel="preload" as="image" href="/assets/menu/galaxy/loading_poster.webp" />
    <style>
      #boot { position: fixed; inset: 0; z-index: 1000; pointer-events: none; transition: opacity 0.35s ease-out;
        background: #1a0e5c url('/assets/menu/galaxy/loading_poster.webp') center / cover no-repeat; }
      #boot.out { opacity: 0; }
      /* The loading bar: the first screen's art arriving (main.ts sets the scale). */
      #boot-track { position: absolute; left: 50%; bottom: max(6vh, 28px); width: min(320px, 60vw); height: 6px; transform: translateX(-50%);
        border-radius: 3px; background: rgba(255, 255, 255, 0.18); overflow: hidden; }
      #boot-bar { height: 100%; width: 100%; border-radius: 3px; background: linear-gradient(90deg, #ffd25a, #ffb12b);
        transform: scaleX(0.08); transform-origin: left; transition: transform 0.25s ease-out; }
      @media (prefers-reduced-motion: reduce) { #boot-bar { transition: none; } }
      @media (orientation: portrait) {
        #boot { background: #1a0e5c url('/assets/menu/galaxy/nomad_bg.webp') center / cover no-repeat; }
        #boot::after { content: ''; position: absolute; inset: 0;
          background: url('/assets/menu/galaxy/loading_poster.webp') center 46% / max(200vw, 100%) auto no-repeat;
          -webkit-mask-image: linear-gradient(transparent calc(46% - 50vw), #000 calc(46% - 30vw), #000 calc(46% + 32vw), transparent calc(46% + 58vw));
          mask-image: linear-gradient(transparent calc(46% - 50vw), #000 calc(46% - 30vw), #000 calc(46% + 32vw), transparent calc(46% + 58vw)); }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="table3d"></canvas>
      <div id="hud"></div>
    </div>
    <div id="screens"></div>
    <div id="boot" aria-hidden="true"><div id="boot-track"><div id="boot-bar"></div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
