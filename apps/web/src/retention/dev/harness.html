<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retention harness</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <style>vite-error-overlay { display: none !important; }</style>
  </head>
  <body>
    <div id="screens"></div>
    <!-- Dev-only: the retention module alone (see harness.ts). ?open=level-up&level=5&t=2.5 opens a screen and steps time. -->
    <script type="module">
      import { setup } from './harness.ts';
      const q = new URLSearchParams(location.search);
      const r = await setup();
      if (q.get('xp')) r.wallet.xp = Number(q.get('xp'));
      const open = q.get('open');
      if (open) await r.router.push(open, Object.fromEntries(q));
      if (q.get('t')) await r.step(Number(q.get('t')));
      document.title = 'ready';
    </script>
  </body>
</html>
